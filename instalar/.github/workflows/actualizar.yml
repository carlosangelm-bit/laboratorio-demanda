name: Actualizar datos y publicar

on:
  schedule:
    - cron: "0 12 * * 1"   # lunes 6:00 a.m. hora del centro de México
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar fuentes públicas
        run: python scripts/actualizar.py
        env:
          DENUE_TOKEN: ${{ secrets.DENUE_TOKEN }}
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos"
          else
            git commit -m "Actualiza datos públicos"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
